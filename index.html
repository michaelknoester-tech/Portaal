<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111213">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>StageBase — Venueportaal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&display=swap" rel="stylesheet">
<style>
  /* ---- tokens: 1-op-1 uit StageBase ---- */
  :root {
    --bg: #111213;
    --surface: #1a1b1e;
    --surface2: #222428;
    --border: #32343a;
    --accent: #e8c84a;
    --accent2: #4ae8b0;
    --red: #e84a4a;
    --text: #f0ede6;
    --muted: #8a8880;
    --font-display: 'Fraunces', serif;
    --font-mono: 'DM Mono', monospace;
    --font-ui: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 13px;
    min-height: 100dvh; overflow-x: hidden; -webkit-text-size-adjust: 100%;
    padding-bottom: env(safe-area-inset-bottom); overscroll-behavior-y: none; }
  * { -webkit-tap-highlight-color: rgba(232,200,74,.15); }

  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) 14px max(32px, env(safe-area-inset-left)); border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,0.4);
  }
  .logo { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: -0.5px; color: var(--accent); line-height: 1; }
  .logo span { color: var(--text); font-weight: 300; font-style: italic; }
  .logo-underline { height: 2px; background: linear-gradient(to right, var(--accent), transparent); border-radius: 1px; margin-top: 3px; width: 100%; }
  .module-tag { font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); border: 1px solid var(--border); border-radius: 2px; padding: 3px 8px; margin-left: 14px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .header-who { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .btn { font-family: var(--font-ui); font-size: 12px; padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--accent); color: #0e0e0f; font-weight: 500; }
  .btn-primary:hover { background: #f0d460; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red); color: white; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  .app { display: flex; height: calc(100dvh - var(--kop, 57px)); }
  .shell { display: flex; width: 100%; min-width: 0; }

  .sidebar { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; background: var(--surface); }
  .sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-title { font-family: var(--font-ui); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  .venue-count { background: var(--surface2); color: var(--muted); padding: 2px 8px; border-radius: 20px; font-size: 11px; }
  .filter-strip { padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .filter-chip { font-family: var(--font-ui); font-size: 10px; padding: 3px 10px; border-radius: 2px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(232,200,74,0.08); }
  .filter-chip:hover:not(.active) { border-color: var(--muted); color: var(--text); }

  .venue-item { padding: 14px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all .2s; border-bottom: 1px solid var(--border); }
  .venue-item:last-child { border-bottom: none; }
  .venue-item:hover { background: var(--surface2); }
  .venue-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .venue-item.past { opacity: .45; }
  .venue-item-name { font-family: var(--font-ui); font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 3px; }
  .venue-item-meta { color: var(--text); font-size: 11px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .venue-item-date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg); }
  .venue-detail { padding: 32px 40px; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .detail-title { font-family: var(--font-display); font-weight: 900; font-size: 36px; line-height: 1.05; letter-spacing: -0.5px; color: var(--text); margin-bottom: 10px; }
  .detail-subtitle { color: var(--text); font-size: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .detail-actions { display: flex; gap: 8px; }

  .sections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .section-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(232,200,74,0.15), 0 0 0 1px rgba(232,200,74,0.2); }
  .section-card.full-width { grid-column: 1 / -1; }
  .section-header { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: linear-gradient(to right, var(--surface2), var(--surface)); }
  .section-icon { font-size: 15px; opacity: .9; }
  .section-title { font-family: var(--font-ui); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--accent); }
  .section-count { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .sub-section { padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .sub-section:last-child { border-bottom: none; }
  .sub-section-title { font-family: var(--font-ui); font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(46,47,50,0.5); }

  .data-row { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid rgba(46,47,50,0.6); gap: 16px; }
  .data-row:last-child { border-bottom: none; }
  .data-label { color: var(--accent); font-size: 10px; letter-spacing: .3px; text-transform: uppercase; opacity: .8; }
  .data-value { color: var(--text); font-size: 12px; line-height: 1.5; }
  .data-value.mono { font-family: var(--font-mono); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 10px; font-family: var(--font-ui); letter-spacing: .5px; }
  .badge-ok { background: rgba(74,232,176,.1); color: var(--accent2); border: 1px solid rgba(74,232,176,.3); }
  .badge-warn { background: rgba(232,200,74,.1); color: var(--accent); border: 1px solid rgba(232,200,74,.3); }
  .badge-bad { background: rgba(232,74,74,.12); color: var(--red); border: 1px solid rgba(232,74,74,.35); }
  .badge-gray { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  /* meetlat: rider tegen de venue */
  .meter { padding: 10px 20px; border-bottom: 1px solid rgba(46,47,50,.6); }
  .meter:last-child { border-bottom: none; }
  .meter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .meter-name { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--accent); opacity: .8; }
  .meter-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .meter-track { position: relative; height: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .meter-have { position: absolute; inset: 0 auto 0 0; background: #2c2e33; }
  .meter-need { position: absolute; inset: 0 auto 0 0; background: var(--accent2); }
  .meter.warn .meter-need { background: var(--accent); }
  .meter.bad .meter-need { background: var(--accent); opacity: .5; }
  .meter-over { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--red), var(--red) 3px, #b93b3b 3px, #b93b3b 6px); }
  .meter-cap { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }

  .issue { display: flex; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgba(46,47,50,.6); }
  .issue:last-child { border-bottom: none; }
  .issue-mark { font-family: var(--font-mono); font-weight: 500; flex: none; width: 16px; text-align: center; }
  .issue.bad .issue-mark { color: var(--red); }
  .issue.warn .issue-mark { color: var(--accent); }
  .issue-text { font-size: 12px; line-height: 1.6; }
  .issue-text b { font-weight: 500; }

  .merkhoek { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 10px; min-width: 0; max-width: 100%; }
  .header-nav { display: flex; gap: 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none; margin-left: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px; }
  .header-nav::-webkit-scrollbar { display: none; }
  .navknop { flex: none; font-family: var(--font-ui); font-weight: 600; font-size: 13px; letter-spacing: .2px; padding: 8px 18px;
    border-radius: 3px; border: none; background: transparent; color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .navknop:hover { background: var(--surface2); }
  .navknop.active { background: var(--accent); color: #0e0e0f; box-shadow: 0 0 18px rgba(232,200,74,.25); }
  .navknop.active:hover { background: #f0d460; }
  .navscheid { width: 1px; background: var(--border); margin: 5px 3px; flex: none; }
  .navknop.extern { color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .navknop.extern:hover { color: var(--accent); background: var(--surface2); }
  .navknop.extern .pijl { font-size: 11px; opacity: .8; }

  .post { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
  .post-kop { display: flex; gap: 12px; align-items: center; padding: 14px 16px 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-weight: 700; font-size: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
  .avatar.prod { border-color: rgba(232,200,74,.5); color: var(--accent); }
  .avatar.venue { border-color: rgba(74,232,176,.5); color: var(--accent2); }
  .post-naam { font-family: var(--font-ui); font-weight: 700; font-size: 13px; cursor: pointer; }
  .post-naam:hover { color: var(--accent); }
  .post-sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .post-tekst { padding: 0 16px 12px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
  .post-tags { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .post-foto { display: block; width: 100%; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .post-voet { padding: 10px 16px; display: flex; gap: 14px; align-items: center; border-top: 1px solid rgba(46,47,50,.6); }
  .postknop { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: var(--font-body); padding: 0; }
  .postknop:hover { color: var(--text); }
  .postknop.aan { color: var(--accent); }

  .markt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .ad { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer;
    transition: border-color .15s, box-shadow .15s; display: flex; flex-direction: column; }
  .ad:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(232,200,74,.12); }
  .ad-beeld { aspect-ratio: 4/3; background: var(--surface2); display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border); overflow: hidden; }
  .ad-beeld img { width: 100%; height: 100%; object-fit: cover; }
  .ad-leeg { font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  .ad-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .ad-titel { font-family: var(--font-ui); font-weight: 700; font-size: 13px; line-height: 1.3; }
  .ad-prijs { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  .ad-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: auto; }
  .ad.verkocht { opacity: .5; }
  .ad-strip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cat { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border); border-left: 3px solid transparent; font-size: 12px; }
  .cat:hover { background: var(--surface2); }
  .cat.active { background: var(--surface2); border-left-color: var(--accent); color: var(--accent); }
  .cat span { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

  .reacties { border-top: 1px solid rgba(46,47,50,.6); background: rgba(0,0,0,.15); }
  .reactie { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid rgba(46,47,50,.4); }
  .reactie:last-child { border-bottom: none; }
  .reactie .avatar { width: 24px; height: 24px; font-size: 9px; }
  .reactie-tekst { font-size: 12px; line-height: 1.6; }
  .reactie-naam { font-family: var(--font-ui); font-weight: 700; font-size: 12px; cursor: pointer; }
  .reactie-naam:hover { color: var(--accent); }
  .reactie-tijd { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-left: 6px; }
  .reactie-invoer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid rgba(46,47,50,.6); align-items: center; }
  .reactie-invoer input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px;
    padding: 8px 11px; color: var(--text); font-family: var(--font-body); font-size: 12px; outline: none; }
  .reactie-invoer input:focus { border-color: var(--accent); }

  .mens { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 3px solid transparent; }
  .mens:hover { background: var(--surface2); }
  .mens.active { background: var(--surface2); border-left-color: var(--accent); }
  .mens-naam { font-family: var(--font-ui); font-weight: 700; font-size: 13px; }
  .mens-sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

  /* aanklikbare regel in een lijst: dezelfde actief-taal als de sidebar */
  .kies { cursor: pointer; border-left: 3px solid transparent; transition: background .15s, border-color .15s; }
  .kies:hover { background: var(--surface2); }
  .kies.active { background: var(--surface2); border-left-color: var(--accent); box-shadow: inset 0 0 24px rgba(232,200,74,.06); }
  .kies.active .kies-naam { color: var(--accent); }
  .kies.active .issue-mark { color: var(--accent) !important; }
  .venue-item.active .venue-item-name { color: var(--accent); }

  .badge-msg { background: rgba(74,232,176,.08); color: var(--accent2); border: 1px solid rgba(74,232,176,.35); }

  .bericht { padding: 12px 20px; border-bottom: 1px solid rgba(46,47,50,.6); border-left: 2px solid transparent; }
  .bericht:last-of-type { border-bottom: none; }
  .bericht.prod { border-left-color: var(--accent); }
  .bericht.venue { border-left-color: var(--accent2); }
  .bericht-kop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 5px; }
  .bericht-van { font-family: var(--font-ui); font-weight: 700; font-size: 12px; }
  .bericht-rol { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-left: 6px; }
  .bericht-tijd { font-family: var(--font-mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .bericht-tekst { font-size: 12px; line-height: 1.65; white-space: pre-wrap; }
  .bericht.nieuw .bericht-van:after { content: '·'; color: var(--accent2); margin-left: 6px; }
  .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px;
    color: var(--text); font-family: var(--font-body); font-size: 12px; outline: none; resize: vertical; min-height: 64px; line-height: 1.6; }
  .form-textarea:focus { border-color: var(--accent); }
  ::placeholder { color: var(--muted); opacity: .8; }

  .notes-area { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; color: var(--text); font-family: var(--font-mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap; }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px; }
  .form-input, .form-select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 9px 12px; color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; transition: border-color .2s; }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface2); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(46,47,50,.6); font-size: 12px; }
  .form-check:last-child { border-bottom: none; }
  .form-check input { accent-color: var(--accent); width: 14px; height: 14px; }

  .naarboven { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 150;
    display: none; align-items: center; gap: 7px; background: var(--accent); color: #0e0e0f; border: none;
    border-radius: 24px; padding: 12px 18px; font-family: var(--font-ui); font-weight: 600; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); cursor: pointer; }
  .naarboven.zichtbaar { display: flex; }

  .opslagmelding { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 400; background: var(--surface); border: 1px solid rgba(232,200,74,.4); border-radius: 6px;
    padding: 12px 14px; font-size: 12px; line-height: 1.6; color: var(--text); display: flex; gap: 12px;
    align-items: flex-start; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .opslagmelding button { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 4px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 16px; text-align: center; padding: 40px; }
  .empty-state-icon { font-size: 48px; opacity: .5; }
  .empty-state h2 { font-family: var(--font-display); font-weight: 300; font-style: italic; font-size: 28px; color: var(--text); }
  .empty-state p { max-width: 340px; line-height: 1.6; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; animation: fadeUp .25s ease; }
  .modal.alert { border-color: rgba(232,200,74,.45); box-shadow: 0 0 60px rgba(232,200,74,.1); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  {k:'perron',  label:'Perron op trailerhoogte', unit:'', type:'bool', need:'Trailer lost direct'},
  {k:'boren',   label:'Boren in toneelvloer',    unit:'', type:'bool', need:'Decor moet vast in de vloer'},

/* ---------- koppeling met StageBase ----------
   Het portaal houdt geen eigen theatergegevens bij. Hieronder staat de
   vertaling van het StageBase-schema naar de velden die het portaal
   vergelijkt. Ontbreekt een waarde, dan blijft hij leeg — dan zegt het
   portaal 'onbekend' in plaats van iets te verzinnen.                    */

const getal = x => {
  if(x===undefined || x===null || x==='') return undefined;
  const m = String(x).replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : undefined;
};
const jaNee = x => {
  if(!x) return undefined;
  const t = String(x).toLowerCase();
  if(/\b(nee|geen|niet|verboden|nvt|n\.v\.t)/.test(t)) return false;
  if(/\b(ja|aanwezig|toegestaan|mogelijk|wel)/.test(t)) return true;
  return undefined;
};
/* zwaarste beschikbare krachtstroomaansluiting */
const zwaarsteAmpere = v => {
  const kandidaten = [
    [v.kracht_125_links || v.kracht_125_rechts, 125],
    [v.kracht_63_links  || v.kracht_63_rechts,   63],
    [v.kracht_32_links  || v.kracht_32_rechts,   32],
    [v.kracht_16_links  || v.kracht_16_rechts,   16]
  ].filter(([aanwezig]) => aanwezig && jaNee(aanwezig) !== false);
  return kandidaten.length ? kandidaten[0][1] : undefined;
};

/* StageBase-record -> portaalfiche */
function uitStageBase(v){
  return {
    id: v.id || (v.naam||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'),
    naam: v.naam || 'Zonder naam',
    zaal: v.type || 'Grote zaal',
    stad: v.stad || '',
    bron: 'stagebase',
    s: {
      opening: getal(v.vaste_opening) ?? getal(v.breedte),
      diepte:  getal(v.diepte),
      hoogte:  getal(v.vliegerhoogte),
      trekken: getal(v.trekken_aantal),
      trekkg:  getal(v.trekken_belasting),
      stroom:  zwaarsteAmpere(v),
      punten:  getal(v.punttrekken_aantal) ?? getal(v.kettingtakels_aantal),
      kleed:   getal(v.kleedkamers),
      opbouw:  undefined,              // staat niet in StageBase — per boeking afspraak
      perron:  jaNee(v.laadperron),
      boren:   jaNee(v.vloer_schroeven),
      bak:     undefined               // StageBase kent wel de maten, niet 'afdekbaar'
    }
  };
}

/* Nieuwe fiches erin schuiven, gekoppeld op naam zodat bestaande tours
   blijven wijzen naar dezelfde venue.                                    */
function neemStageBaseOver(lijst){
  let nieuw = 0, bijgewerkt = 0;
  lijst.map(uitStageBase).forEach(sb=>{
    const bestaand = VENUES.find(v => v.naam.toLowerCase().replace(/[^a-z]/g,'') === sb.naam.toLowerCase().replace(/[^a-z]/g,''));
    if(bestaand){ Object.assign(bestaand, {zaal:sb.zaal, stad:sb.stad, s:sb.s, bron:'stagebase'}); bijgewerkt++; }
    else { VENUES.push(sb); nieuw++; }
  });
  return {nieuw, bijgewerkt};
}

/* Draait het portaal straks op dezelfde plek als StageBase, dan staan de
   fiches er gewoon al. Nu meestal niet, dus dan valt hij terug op demodata. */
function probeerStageBaseLokaal(){
  try {
    const ruw = window.localStorage.getItem('stagebase_venues');
    if(!ruw) return 0;
    const lijst = JSON.parse(ruw);
    if(!Array.isArray(lijst) || !lijst.length) return 0;
    const r = neemStageBaseOver(lijst);
    return r.nieuw + r.bijgewerkt;
  } catch(e){ return 0; }   // andere herkomst of afgeschermde opslag
}

/* opslag van een oudere versie aanvullen, zodat een schemawijziging niets sloopt */
function migreer(){
  if(!DB || typeof DB !== 'object') DB = {};
  if(!Array.isArray(DB.productions)) DB.productions = SEED;
  if(!Array.isArray(DB.users) || !DB.users.length) DB.users = SEED_USERS;
  if(DB.sessie === undefined) DB.sessie = null;
  if(!DB.gezien || typeof DB.gezien !== 'object') DB.gezien = {};
  const eersteProd = DB.users.find(u=>u.rol==='prod');
  if(!DB.berichten || typeof DB.berichten !== 'object') DB.berichten = {};
  if(!Array.isArray(DB.posts)) DB.posts = SEED_POSTS;
  if(!Array.isArray(DB.markt)) DB.markt = SEED_MARKT;
  if(!DB.volgt || typeof DB.volgt !== 'object') DB.volgt = SEED_VOLGT;
  if(!DB.gelezen  || typeof DB.gelezen  !== 'object') DB.gelezen = {};
  DB.productions.forEach(p=>{
    if(!Array.isArray(p.tour)) p.tour = [];
    if(!p.rider || typeof p.rider !== 'object') p.rider = {};
    p.tour.forEach(st=>{ if(!st.id) st.id = `${p.id}-${st.venue}-${st.van}`; });
    if(!p.owner) p.owner = (p.id==='p2' ? 'u2' : (eersteProd ? eersteProd.id : 'u1'));
  });
  DB.users.forEach(u=>{ if(u.rol==='venue' && !venueById(u.venueId)) u.venueId = VENUES[0].id; });
  if(DB.sessie && !DB.users.some(u=>u.id===DB.sessie)) DB.sessie = null;
  // nieuwe demodata erbij zetten zonder eigen producties of accounts te raken
  if(DB.seedVersie !== SEED_VERSIE){
    // demoproducties terugzetten op de seed: speeldata schuiven mee met vandaag,
    // en de speelblok-id's moeten kloppen met de voorbeeldgesprekken
    SEED.forEach(vers=>{
      const oud = DB.productions.find(x=>x.id===vers.id);
      if(oud){ oud.tour = vers.tour; oud.rider = vers.rider; oud.notities = vers.notities; }
    });
    DB.productions.forEach(p=>p.tour.forEach(st=>{ if(!st.id) st.id = `${p.id}-${st.venue}-${st.van}`; }));
    SEED_USERS.forEach(u=>{ if(!DB.users.some(x=>x.id===u.id || x.email===u.email)) DB.users.push(u); });
    SEED.forEach(p=>{ if(!DB.productions.some(x=>x.id===p.id)) DB.productions.push(p); });
    Object.entries(SEED_BERICHTEN).forEach(([k,v])=>{ if(!DB.berichten[k]) DB.berichten[k]=v; });
    // gesprekken die nergens meer aan hangen (oude speeldata) opruimen
    Object.keys(DB.berichten).forEach(k=>{
      const hoort = DB.productions.some(p=>p.tour.some(st=>st.id===k));
      if(!hoort && /^p\d+-/.test(k)) delete DB.berichten[k];
    });
    SEED_POSTS.forEach(x=>{ if(!DB.posts.some(y=>y.id===x.id)) DB.posts.push(x); });
    SEED_MARKT.forEach(x=>{ if(!DB.markt.some(y=>y.id===x.id)) DB.markt.push(x); });
    Object.entries(SEED_VOLGT).forEach(([k,v])=>{ if(!DB.volgt[k]) DB.volgt[k]=v; });
    DB.seedVersie = SEED_VERSIE;
  }
}

/* ---------- vergelijking ---------- */
function compare(rider, venue){
  return SPECS.map(sp => {
    const need = rider[sp.k], have = venue.s[sp.k];
    if(need===undefined || need==='' || need===null) return {sp,need,have,status:'unknown'};
    if(sp.type==='bool'){
      if(!need) return {sp,need,have,status:'ok'};
      if(have===undefined) return {sp,need,have,status:'unknown'};   // niet ingevuld is geen 'nee'
      return {sp,need,have,status: have ? 'ok' : 'bad'};
    }
    if(have===undefined) return {sp,need,have,status:'unknown'};
    if(need>have) return {sp,need,have,status:'bad'};
    if(need>have*0.9) return {sp,need,have,status:'warn'};
    return {sp,need,have,status:'ok'};
  });
}
const countBad  = r => r.filter(x=>x.status==='bad').length;
const countWarn = r => r.filter(x=>x.status==='warn').length;

function statusBadge(rows){
  const b = countBad(rows), w = countWarn(rows);
  if(b) return `<span class="badge badge-bad">${b} knelpunt${b>1?'en':''}</span>`;
  if(w) return `<span class="badge badge-warn">${w}× krap</span>`;
  return `<span class="badge badge-ok">past</span>`;
}

function issueText(r){
  const {sp,need,have} = r;
  if(sp.type==='bool'){
    if(sp.k==='perron') return '<b>Lossen.</b> Productie lost direct vanaf de trailer, deze venue heeft geen perron op trailerhoogte. Laadklep of extra sjouwploeg regelen.';
    if(sp.k==='boren')  return '<b>Vloer.</b> Decor moet vast in de vloer, hier mag niet geboord worden. Ballast of alternatieve bevestiging afstemmen.';
    if(sp.k==='bak')    return '<b>Orkestbak.</b> Speelvlak loopt over de bak, die hier niet afdekbaar is. Speelvlak inkorten of extern laten afdekken.';
  }
  const tekort = Math.round((need-have)*100)/100;
  if(r.status==='bad') return `<b>${sp.label}.</b> Rider vraagt ${need}${sp.unit}, venue biedt ${have}${sp.unit} — ${tekort}${sp.unit} tekort.`;
  return `<b>${sp.label}.</b> Rider vraagt ${need}${sp.unit} op ${have}${sp.unit} beschikbaar. Vrijwel geen marge.`;
}

function render(){

  scrollSleutel = schermSleutel();

function magZien(prod, venue){
  const u = huidige(); if(!u) return false;
  if(u.rol==='prod') return prod.owner === u.id;   // je eigen productie
  return u.venueId === venue.id;                    // toneelmeester van deze venue
}

/* geboekte blokken in een venue, alleen wat je mag zien */
function agenda(vid){
  const v = venueById(vid), out = [];
  DB.productions.forEach(p=>p.tour.forEach(st=>{ if(st.venue===vid && magZien(p,v)) out.push({p,st}); }));
  return out.sort((a,b)=>a.st.van.localeCompare(b.st.van));
}

async function reageer(postId, tekst){
  const u = huidige(), post = DB.posts.find(p=>p.id===postId); if(!post) return;
  (post.reacties = post.reacties || []).push({id:'r'+Date.now(), van:u.id, tijd:new Date().toISOString(), tekst});
  await save();
}

async function toggleHart(id){
  const post = DB.posts.find(p=>p.id===id); if(!post) return;
  post.harten = post.harten || [];
  const i = post.harten.indexOf(DB.sessie);
  i<0 ? post.harten.push(DB.sessie) : post.harten.splice(i,1);
  herteken(id); await save();
}

/* één bericht vervangen; de rest van de pagina blijft staan waar hij stond */
function herteken(postId){
  const oud = document.getElementById('post-'+postId);
  const post = DB.posts.find(p=>p.id===postId);
  if(!oud || !post) return render();
  oud.replaceWith(postKaart(post));
}

function geleden(t){
  const m = Math.round((Date.now()-new Date(t))/60000);
  if(m < 60) return m<=1 ? 'zojuist' : m+' min geleden';
  const h = Math.round(m/60); if(h < 24) return h+' uur geleden';
  const dg = Math.round(h/24); return dg===1 ? 'gisteren' : dg+' dagen geleden';
}

function postKaart(post){
  const u = gebruiker(post.van) || {naam:'Onbekend', rol:'prod'};
  const prod = post.prodId ? DB.productions.find(p=>p.id===post.prodId) : null;
  const ven  = post.venueId ? venueById(post.venueId) : null;
  const harten = post.harten || [];
  const reacties = post.reacties || [];
  const ik = harten.includes(DB.sessie);
  const node = el(`<div class="post" id="post-${post.id}">
    <div class="post-kop">
      <div class="avatar ${u.rol}">${esc(initialen(u.naam))}</div>
      <div style="flex:1">
        <div class="post-naam" data-mens="${post.van}">${esc(u.naam)}</div>
        <div class="post-sub">${u.rol==='venue' ? esc(venueById(u.venueId)?.naam||'theater') : 'productie'} · ${geleden(post.tijd)}</div>
      </div>
      ${post.van!==DB.sessie ? `<button class="btn ${volgtHij(DB.sessie,post.van)?'btn-ghost':'btn-primary'} btn-sm" data-volg="${post.van}">${volgtHij(DB.sessie,post.van)?'Ontvolgen':'Volgen'}</button>` : ''}
    </div>
    <div class="post-tekst">${esc(post.tekst)}</div>
    ${(prod||ven) ? `<div class="post-tags">${prod?`<span class="badge badge-warn">${esc(prod.naam)}</span>`:''}${ven?`<span class="badge badge-msg">${esc(ven.naam)} · ${esc(ven.stad)}</span>`:''}</div>` : ''}
    ${post.foto ? `<img class="post-foto" src="${post.foto}" alt="">` : ''}
    <div class="post-voet">
      <button class="postknop ${ik?'aan':''}" data-hart="${post.id}">${ik?'♥':'♡'} ${harten.length||''}</button>
      <button class="postknop" data-reageer="${post.id}">💬 ${reacties.length||'reageren'}</button>
      <span style="flex:1"></span>
      <span class="post-sub">${post.van===DB.sessie?'jouw bericht':''}</span>
    </div>
    ${reacties.length ? `<div class="reacties">${reacties.map(r=>{
      const rg = gebruiker(r.van) || {naam:'Onbekend', rol:'prod'};
      return `<div class="reactie"><div class="avatar ${rg.rol}">${esc(initialen(rg.naam))}</div>
        <div><span class="reactie-naam" data-mens="${r.van}">${esc(rg.naam)}</span><span class="reactie-tijd">${geleden(r.tijd)}</span>
        <div class="reactie-tekst">${esc(r.tekst)}</div></div></div>`;
    }).join('')}</div>` : ''}
    ${view.reageer===post.id ? `<div class="reactie-invoer">
      <input id="rtekst" placeholder="Reageren…" autofocus>
      <button class="btn btn-primary btn-sm" id="rplaats">Plaatsen</button></div>` : ''}
  </div>`);
  node.querySelectorAll('[data-volg]').forEach(b=>b.onclick=()=>toggleVolg(b.dataset.volg));
  node.querySelectorAll('[data-hart]').forEach(b=>b.onclick=()=>toggleHart(b.dataset.hart));
  node.querySelectorAll('[data-mens]').forEach(b=>b.onclick=()=>{ view.persoon=b.dataset.mens; render(); });
  node.querySelectorAll('[data-reageer]').forEach(b=>b.onclick=()=>{
    const vorige = view.reageer;
    view.reageer = vorige===b.dataset.reageer ? null : b.dataset.reageer;
    if(vorige && vorige!==b.dataset.reageer) herteken(vorige);
    herteken(b.dataset.reageer);
  });
  const invoer = node.querySelector('#rtekst');
  if(invoer){
    const versturen = async()=>{
      const t = invoer.value.trim(); if(!t) return;
      await reageer(post.id, t); view.reageer = null; herteken(post.id);
    };
    node.querySelector('#rplaats').onclick = versturen;
    invoer.onkeydown = e=>{ if(e.key==='Enter') versturen(); };
    setTimeout(()=>invoer.focus(), 0);
  }
  return node;
}

function werkveldView(){
  const u = huidige();
  if(!view.feed) view.feed = volgtLijst(u.id).length ? 'volgend' : 'alles';
  const mensen = DB.users.filter(x=>x.id!==u.id)
    .sort((a,b)=>(volgtHij(u.id,b.id)?1:0)-(volgtHij(u.id,a.id)?1:0) || a.naam.localeCompare(b.naam));

  const mensRegels = mensen.map(m=>`<div class="mens ${view.persoon===m.id?'active':''}" data-mens="${m.id}">
      <div class="avatar ${m.rol}">${esc(initialen(m.naam))}</div>
      <div style="flex:1"><div class="mens-naam">${esc(m.naam)}</div>
        <div class="mens-sub">${m.rol==='venue' ? esc(venueById(m.venueId)?.naam||'theater') : 'productie'}</div></div>
      <button class="btn ${volgtHij(u.id,m.id)?'btn-ghost':'btn-primary'} btn-sm" data-volg="${m.id}">${volgtHij(u.id,m.id)?'✓':'Volg'}</button>
    </div>`).join('');

  const node = el(`<div class="shell">
    <div class="sidebar">
      <div class="sidebar-header"><span class="sidebar-title">Het werkveld</span>
        <span class="venue-count">${volgtLijst(u.id).length} gevolgd</span></div>
      <div class="filter-strip">
        <button class="filter-chip ${view.feed==='volgend'&&!view.persoon?'active':''}" data-f="volgend">Wie ik volg</button>
        <button class="filter-chip ${view.feed==='alles'&&!view.persoon?'active':''}" data-f="alles">Alles</button>
      </div>
      ${mensRegels}
    </div>
    <div class="main" id="main"></div>
  </div>`);
  app.append(node);
  node.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ view.feed=b.dataset.f; view.persoon=null; render(); });
  node.querySelectorAll('[data-mens]').forEach(b=>b.onclick=e=>{ if(e.target.dataset.volg) return; view.persoon=b.dataset.mens; render(); focusDetail(); });
  node.querySelectorAll('[data-volg]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); toggleVolg(b.dataset.volg); });

  const main = node.querySelector('#main');
  const detail = el(`<div class="venue-detail"><div id="kop"></div><div id="feed"></div></div>`);
  main.append(detail);

  // kop: eigen feed of het profiel van iemand anders
  if(view.persoon){
    const m = gebruiker(view.persoon);
    const kop = el(`<div class="detail-header">
      <div><div class="detail-title">${esc(m.naam)}</div>
        <div class="detail-subtitle"><span>${m.rol==='venue' ? esc(venueById(m.venueId)?.naam||'theater') : 'productie'}</span>
        <span class="venue-item-date">${DB.posts.filter(p=>p.van===m.id).length} berichten</span></div></div>
      <div class="detail-actions"><button class="btn btn-ghost" id="terugfeed">Terug naar het werkveld</button>
        <button class="btn ${volgtHij(u.id,m.id)?'btn-ghost':'btn-primary'}" data-volg="${m.id}">${volgtHij(u.id,m.id)?'Ontvolgen':'Volgen'}</button></div></div>`);
    detail.querySelector('#kop').append(kop);
    kop.querySelector('#terugfeed').onclick = ()=>{ view.persoon=null; view.mobiel='detail'; render(); };
    kop.querySelectorAll('[data-volg]').forEach(b=>b.onclick=()=>toggleVolg(b.dataset.volg));
  } else {
    detail.querySelector('#kop').append(schrijfKaart());
  }

  // de berichten zelf
  let posts = [...DB.posts].sort((a,b)=>b.tijd.localeCompare(a.tijd));
  if(view.persoon) posts = posts.filter(p=>p.van===view.persoon);
  else if(view.feed==='volgend') posts = posts.filter(p=>p.van===u.id || volgtHij(u.id,p.van));

  const feed = detail.querySelector('#feed');
  if(!posts.length){
    feed.append(el(`<div class="empty-state" style="height:auto;padding:50px 20px"><div class="empty-state-icon">◎</div>
      <h2>Nog stil hier</h2><p>${view.persoon?'Deze collega heeft nog niets geplaatst.':'Volg een paar collega\'s, of zet de lijst op Alles om te zien wat er speelt.'}</p></div>`));
  } else posts.forEach(x=>feed.append(postKaart(x)));
}

/* het schrijfvak */
function schrijfKaart(){
  const u = huidige();
  const prodOpties = DB.productions.map(p=>`<option value="${p.id}">${esc(p.naam)}</option>`).join('');
  const venOpties  = VENUES.map(v=>`<option value="${v.id}">${esc(v.naam)} — ${esc(v.stad)}</option>`).join('');
  const node = el(`<div class="section-card full-width" style="margin-bottom:18px">
    <div class="section-header"><span class="section-icon">✎</span><span class="section-title">Waar ben je mee bezig</span></div>
    <div class="sub-section">
      <textarea class="form-textarea" id="ptekst" placeholder="Waar sta je vandaag?"></textarea>
      <div class="form-grid" style="margin-top:10px">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Productie (optioneel)</label>
          <select class="form-select" id="pprod"><option value="">—</option>${prodOpties}</select></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Theater (optioneel)</label>
          <select class="form-select" id="pven"><option value="">—</option>${venOpties}</select></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">Foto kiezen<input type="file" accept="image/*" id="pfoto" style="display:none"></label>
        <span class="post-sub" id="fotonaam"></span>
        <span style="flex:1"></span>
        <button class="btn btn-primary" id="plaats">Plaatsen</button>
      </div>
      <img id="voorbeeld" class="post-foto" style="display:none;margin-top:12px;border-radius:3px">
    </div>
  </div>`);

  let fotoData = null;
  node.querySelector('#pfoto').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const lezer = new FileReader();
    lezer.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const max = 720, sch = Math.min(1, max/img.width);
          const c = document.createElement('canvas');
          c.width = img.width*sch; c.height = img.height*sch;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          fotoData = c.toDataURL('image/jpeg', 0.6);
        } catch(err){ fotoData = lezer.result; }
        node.querySelector('#voorbeeld').src = fotoData;
        node.querySelector('#voorbeeld').style.display = 'block';
        node.querySelector('#fotonaam').textContent = f.name;
      };
      img.onerror = ()=>{ fotoData = lezer.result; node.querySelector('#fotonaam').textContent = f.name; };
      img.src = lezer.result;
    };
    lezer.readAsDataURL(f);
  };

  node.querySelector('#plaats').onclick = async()=>{
    const tekst = node.querySelector('#ptekst').value.trim(); if(!tekst) return;
    await plaats({id:'t'+Date.now(), van:u.id, tijd:new Date().toISOString(), tekst,
      prodId:node.querySelector('#pprod').value || undefined,
      venueId:node.querySelector('#pven').value || undefined,
      foto: fotoData || undefined, harten:[]});
    render();
  };
  return node;
}

/* ---------- marktplaats ---------- */
function marktLijst(){
  let l = [...DB.markt].sort((a,b)=>b.tijd.localeCompare(a.tijd));
  if(view.marktFilter==='mijn') l = l.filter(a=>a.van===DB.sessie);
  else if(view.marktFilter==='aangeboden' || view.marktFilter==='gezocht') l = l.filter(a=>a.soort===view.marktFilter);
  if(view.marktCat) l = l.filter(a=>a.cat===view.marktCat);
  return l.sort((a,b)=>(a.verkocht?1:0)-(b.verkocht?1:0));
}

function marktView(){
  const u = huidige();
  if(!view.marktFilter) view.marktFilter = 'alles';
  const catRegels = MARKT_CATS.map(c=>{
    const n = DB.markt.filter(a=>a.cat===c && !a.verkocht).length;
    return `<div class="cat ${view.marktCat===c?'active':''}" data-cat="${c}">${esc(c)}<span>${n}</span></div>`;
  }).join('');

  const node = el(`<div class="shell">
    <div class="sidebar">
      <div class="sidebar-header"><span class="sidebar-title">Marktplaats</span>
        <button class="btn btn-primary btn-sm" id="adnieuw">+ Plaatsen</button></div>
      <div class="filter-strip">
        <button class="filter-chip ${view.marktFilter==='alles'?'active':''}" data-mf="alles">Alles</button>
        <button class="filter-chip ${view.marktFilter==='aangeboden'?'active':''}" data-mf="aangeboden">Aangeboden</button>
        <button class="filter-chip ${view.marktFilter==='gezocht'?'active':''}" data-mf="gezocht">Gezocht</button>
        <button class="filter-chip ${view.marktFilter==='mijn'?'active':''}" data-mf="mijn">Van mij</button>
      </div>
      <div class="cat ${!view.marktCat?'active':''}" data-cat="">Alle categorieën<span>${DB.markt.filter(a=>!a.verkocht).length}</span></div>
      ${catRegels}
    </div>
    <div class="main" id="main"></div>
  </div>`);
  app.append(node);
  node.querySelector('#adnieuw').onclick = ()=>{ view.adNieuw=true; view.adId=null; render(); focusDetail(); };
  node.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{ view.marktFilter=b.dataset.mf; view.adId=null; view.adNieuw=false; render(); focusDetail(); });
  node.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ view.marktCat=b.dataset.cat||null; view.adId=null; view.adNieuw=false; render(); focusDetail(); });

  const main = node.querySelector('#main');
  if(view.adNieuw) return main.append(adFormulier());
  const gekozen = view.adId ? DB.markt.find(a=>a.id===view.adId) : null;
  if(gekozen) return main.append(adDetail(gekozen));

  const l = marktLijst();
  const detail = el(`<div class="venue-detail">
    <div class="detail-header"><div><div class="detail-title">${view.marktCat ? esc(view.marktCat) : 'Marktplaats'}</div>
      <div class="detail-subtitle"><span>${l.length} advertentie${l.length===1?'':'s'}</span>
      ${view.marktFilter!=='alles'?`<span class="badge badge-warn">${esc(view.marktFilter==='mijn'?'van mij':view.marktFilter)}</span>`:''}
      ${view.marktCat?`<span class="badge badge-msg">${esc(view.marktCat)}</span>`:''}
      <span class="venue-item-date">spullen uit het vak, van collega's</span></div></div></div>
    <div class="markt-grid" id="grid"></div></div>`);
  main.append(detail);
  const grid = detail.querySelector('#grid');
  if(!l.length){
    const leeg = el(`<div class="empty-state" style="height:auto;padding:50px 20px">
      <div class="empty-state-icon">◫</div><h2>Niets gevonden</h2>
      <p>Geen advertenties in deze combinatie van filters${view.marktCat?' (categorie '+esc(view.marktCat)+')':''}.</p>
      <button class="btn btn-primary" id="wisfilters">Filters wissen</button></div>`);
    detail.querySelector('#grid').replaceWith(leeg);
    leeg.querySelector('#wisfilters').onclick = ()=>{ view.marktCat=null; view.marktFilter='alles'; render(); };
  } else l.forEach(a=>grid.append(adKaart(a)));
}

    <div class="sections-grid">
      <div class="section-card full-width">
        <div class="section-header"><span class="section-icon">◫</span><span class="section-title">Omschrijving</span>
          <span class="section-count">${esc(a.prijs||'n.o.t.k.')}</span></div>
        ${a.foto?`<img class="post-foto" src="${a.foto}" alt="">`:''}
        <div class="sub-section" style="font-size:13px;line-height:1.7;white-space:pre-wrap">${esc(a.tekst||'')}</div>

          return `<div class="reactie"><div class="avatar ${rg.rol}">${esc(initialen(rg.naam))}</div>
            <div><span class="reactie-naam">${esc(rg.naam)}</span><span class="reactie-tijd">${geleden(r.tijd)}</span>
            <div class="reactie-tekst">${esc(r.tekst)}</div></div></div>`;
        }).join('')}</div>` : '<div class="sub-section" style="color:var(--muted);font-size:12px">Nog geen reacties.</div>'}
        <div class="reactie-invoer"><input id="atekst" placeholder="Vraag of bod…">
          <button class="btn btn-primary btn-sm" id="aplaats">Plaatsen</button></div>
      </div>
    </div>
  </div>`);

  node.querySelector('#terugmarkt').onclick = ()=>{ view.adId=null; view.mobiel='detail'; render(); };

    (a.reacties = a.reacties || []).push({id:'m'+Date.now(), van:DB.sessie, tijd:new Date().toISOString(), tekst:t});

    node.querySelector('#weg').onclick = async()=>{
      DB.markt.splice(DB.markt.indexOf(a),1); await save(); view.adId=null; render(); };

        <div class="form-group"><label class="form-label">Prijs</label><input class="form-input" id="aprijs" placeholder="€25 p.st. of n.o.t.k."></div>
        <div class="form-group"><label class="form-label">Plaats</label><input class="form-input" id="aplaats2" placeholder="Waar staat het"></div>
      </div>
      <div class="form-group"><label class="form-label">Omschrijving</label>
        <textarea class="form-textarea" id="aomschrijving" placeholder="Staat, aantal, ophalen…"></textarea></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">Foto kiezen<input type="file" accept="image/*" id="afoto" style="display:none"></label>
        <span class="post-sub" id="afotonaam"></span>
        <span style="flex:1"></span>
        <button class="btn btn-primary" id="aplaatsen">Plaatsen</button>
      </div>
      <img id="avoorbeeld" class="post-foto" style="display:none;margin-top:12px;border-radius:3px">
    </div></div>
  </div>`);

  let fotoData = null;
  node.querySelector('#afoto').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const lezer = new FileReader();
    lezer.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        try {
          const max=720, sch=Math.min(1,max/img.width);
          const c=document.createElement('canvas'); c.width=img.width*sch; c.height=img.height*sch;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          fotoData=c.toDataURL('image/jpeg',0.6);
        } catch(err){ fotoData = lezer.result; }
        node.querySelector('#avoorbeeld').src = fotoData;
        node.querySelector('#avoorbeeld').style.display='block';
        node.querySelector('#afotonaam').textContent = f.name;
      };
      img.onerror = ()=>{ fotoData = lezer.result; node.querySelector('#afotonaam').textContent = f.name; };
      img.src = lezer.result;
    };
    lezer.readAsDataURL(f);
  };
  node.querySelector('#terugmarkt').onclick = ()=>{ view.adNieuw=false; render(); };
  node.querySelector('#aplaatsen').onclick = async()=>{
    const titel = node.querySelector('#atitel').value.trim(); if(!titel) return;
    DB.markt.unshift({id:'a'+Date.now(), van:DB.sessie, tijd:new Date().toISOString(),
      soort:node.querySelector('#asoort').value, cat:node.querySelector('#acat').value, titel,
      prijs:node.querySelector('#aprijs').value.trim(), plaats:node.querySelector('#aplaats2').value.trim(),
      tekst:node.querySelector('#aomschrijving').value.trim(), foto:fotoData||undefined, reacties:[]});
    await save(); view.adNieuw=false; view.adId=DB.markt[0].id; render();
  };
  return node;
}

/* ---------- overleg tussen productie en venue, per speelblok ---------- */
const draad = stopId => DB.berichten[stopId] || [];
const leesSleutel = stopId => DB.sessie + '|' + stopId;
function ongelezen(stopId){
  const sinds = DB.gelezen[leesSleutel(stopId)] || '';
  return draad(stopId).filter(b => b.van !== DB.sessie && b.tijd > sinds).length;
}
async function markeerGelezen(stopId){
  const d = draad(stopId); if(!d.length) return;
  const laatste = d[d.length-1].tijd;
  if(DB.gelezen[leesSleutel(stopId)] === laatste) return;
  DB.gelezen[leesSleutel(stopId)] = laatste; await save();
}
async function stuur(stopId, tekst){
  const u = huidige();
  (DB.berichten[stopId] = DB.berichten[stopId] || []).push({
    id: 'b'+Date.now(), van: u.id, naam: u.naam, rol: u.rol, tekst, tijd: new Date().toISOString()
  });
  DB.gelezen[leesSleutel(stopId)] = new Date().toISOString();
  await save();
}
const tijdLabel = t => new Date(t).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function overlegKaart(p, v, st){
  const d = draad(st.id);
  const sinds = DB.gelezen[leesSleutel(st.id)] || '';
  const regels = d.map(b=>`<div class="bericht ${b.rol} ${b.van!==DB.sessie && b.tijd>sinds ? 'nieuw':''}">
      <div class="bericht-kop"><span><span class="bericht-van">${esc(b.naam)}</span><span class="bericht-rol">${b.rol==='prod'?esc(p.naam):esc(v.naam)}</span></span>
        <span class="bericht-tijd">${tijdLabel(b.tijd)}</span></div>
      <div class="bericht-tekst">${esc(b.tekst)}</div></div>`).join('')
    || `<div class="sub-section" style="color:var(--muted);font-size:12px">Nog geen overleg over dit speelblok. Stel hieronder je vraag — hij blijft bij deze datum staan.</div>`;

  const node = el(`<div class="section-card full-width">
    <div class="section-header"><span class="section-icon">✉</span><span class="section-title">Overleg</span>
      <span class="section-count">${d.length} bericht${d.length===1?'':'en'}</span></div>
    ${regels}
    <div class="sub-section">
      <textarea class="form-textarea" id="tekst" placeholder="${huidige().rol==='prod' ? 'Je vraag aan de venue…' : 'Je antwoord aan de productie…'}"></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <button class="btn btn-primary" id="verstuur">Versturen</button>
        <span style="color:var(--muted);font-size:11px;font-family:var(--font-mono)">Zichtbaar voor ${huidige().rol==='prod' ? esc(v.naam) : esc(p.naam)}</span>
      </div>
    </div>
  </div>`);

  const verstuur = async()=>{
    const t = node.querySelector('#tekst').value.trim(); if(!t) return;
    await stuur(st.id, t); render();
  };
  node.querySelector('#verstuur').onclick = verstuur;
  node.querySelector('#tekst').onkeydown = e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) verstuur(); };
  markeerGelezen(st.id);
  return node;
}

function ficheWaarde(v, sp){
  const w = v.s[sp.k];
  if(w === undefined || w === null || w === '') return '<span style="color:var(--muted)">onbekend</span>';
  return sp.type==='bool' ? (w?'ja':'nee') : w + ' ' + sp.unit;
}

function ficheKaart(v){
  const bronTekst = {perron:'laadperron', trekken:'trekken', kleed:'kleedkamers'};
  const rijen = SPECS.map(sp=>{
    const rt = v.ruw && bronTekst[sp.k] ? v.ruw[bronTekst[sp.k]] : null;
    return `<div class="data-row"><div class="data-label">${esc(sp.label)}</div>
      <div class="data-value mono">${ficheWaarde(v, sp)}
      ${rt?`<div style="color:var(--muted);font-size:10px;margin-top:3px;line-height:1.5">uit StageBase: ${esc(rt)}</div>`:''}</div></div>`;
  }).join('');
  const leeg = SPECS.filter(sp=>v.s[sp.k]===undefined).length;
  const uitSB = v.bron==='stagebase';
  return `<div class="sections-grid"><div class="section-card full-width">
    <div class="section-header"><span class="section-icon">⌂</span><span class="section-title">Technische gegevens</span>
      <span class="section-count">${uitSB?'uit StageBase':'demowaarden'}</span></div>
    <div class="sub-section">${rijen}</div>
    <div class="sub-section" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="color:var(--muted);font-size:11px;font-family:var(--font-mono);flex:1">
        ${uitSB ? 'Deze fiche komt uit StageBase.' : 'Demowaarden — nog niet gekoppeld aan StageBase.'}
        ${leeg?` ${leeg} veld${leeg===1?'':'en'} niet ingevuld; die worden niet beoordeeld.`:''}</span>
      <button class="btn btn-ghost btn-sm" data-import="1">Uit StageBase laden</button>
    </div>
  </div></div>`;
}

/* fiches overnemen uit een StageBase-export */
function importPaneel(){
  const node = el(`<div class="venue-detail" style="max-width:640px">
    <div class="detail-header"><div><div class="detail-title">Fiches uit StageBase</div>
      <div class="detail-subtitle">Eén bron voor de theatergegevens — het portaal houdt ze niet zelf bij.</div></div>
      <div class="detail-actions"><button class="btn btn-ghost" id="terug">Terug</button></div></div>
    <div class="section-card full-width">
      <div class="section-header"><span class="section-icon">⇄</span><span class="section-title">Overnemen</span></div>
      <div class="sub-section" style="font-size:12px;line-height:1.7;color:var(--muted)">
        Draaien StageBase en het portaal straks op hetzelfde adres, dan staan de fiches er automatisch in.
        Zolang het twee losse apps zijn, plak je hier de export uit StageBase — of kies het JSON-bestand.
      </div>
      <div class="sub-section">
        <div class="form-group"><label class="form-label">JSON uit StageBase</label>
          <textarea class="form-textarea" id="json" style="min-height:150px;font-family:var(--font-mono)" placeholder='[{"naam":"…","stad":"…"}]'></textarea></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">Bestand kiezen<input type="file" accept=".json,application/json" id="bestand" style="display:none"></label>
          <span style="flex:1"></span>
          <button class="btn btn-primary" id="doe">Fiches overnemen</button>
        </div>
        <div id="uitslag" style="font-size:12px;margin-top:12px;line-height:1.7"></div>
      </div>
    </div>
  </div>`);

  const verwerk = async(ruw)=>{
    const uitslag = node.querySelector('#uitslag');
    let lijst;
    try { lijst = JSON.parse(ruw); } catch(e){ uitslag.innerHTML = '<span style="color:var(--red)">Dat is geen geldige JSON.</span>'; return; }
    if(!Array.isArray(lijst)) lijst = [lijst];
    if(!lijst.length || !lijst.some(x=>x && x.naam)){ uitslag.innerHTML = '<span style="color:var(--red)">Geen venues met een naam gevonden.</span>'; return; }
    const r = neemStageBaseOver(lijst);
    DB.venues = VENUES; await save();
    const gekoppeld = VENUES.filter(v=>v.bron==='stagebase');
    uitslag.innerHTML = `<span style="color:var(--accent2)">${r.bijgewerkt} fiche${r.bijgewerkt===1?'':'s'} bijgewerkt, ${r.nieuw} nieuw toegevoegd.</span><br>` +
      gekoppeld.map(v=>{
        const leeg = SPECS.filter(sp=>v.s[sp.k]===undefined).map(sp=>sp.label);
        return `<span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">${esc(v.naam)} — ${SPECS.length-leeg.length} van ${SPECS.length} velden${leeg.length?', mist: '+esc(leeg.join(', ')):''}</span>`;
      }).join('<br>');
  };

  node.querySelector('#doe').onclick = ()=>verwerk(node.querySelector('#json').value.trim());
  node.querySelector('#bestand').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const l = new FileReader(); l.onload = ()=>{ node.querySelector('#json').value = l.result; verwerk(l.result); }; l.readAsText(f);
  };
  node.querySelector('#terug').onclick = ()=>{ view.importeren=false; render(); };
  return node;
}

/* ---------- productiekant: theaters links ---------- */
function huizenView(){

  const k = komend(v.id);
  if(!view.tab || (view.tab!=='fiche' && view.tab!=='agenda')) view.tab = k.length ? 'agenda' : 'fiche';
  if(view.sel === null || view.sel === undefined || view.sel >= k.length) view.sel = 0;

  const rijen = k.map((x,i)=>`<div class="issue kies ${i===view.sel?'active':''}" data-a="${i}">
      <span class="issue-mark" style="color:var(--muted)">${i===view.sel?'▸':'·'}</span>
      <div class="issue-text" style="flex:1">
        <b class="kies-naam">${esc(x.p.naam)}</b> <span style="color:var(--muted)">${esc(x.p.gezelschap)}</span><br>
        <span class="venue-item-date">${fmtDate(x.st.van)} t/m ${fmtDate(x.st.tot)} · ${dagen(daysTo(x.st.van))}</span>
      </div><div>${ongelezen(x.st.id)?`<span class="badge badge-msg">✉ ${ongelezen(x.st.id)}</span> `:''}${statusBadge(compare(x.p.rider, v))}</div></div>`).join('');

  const geenAgenda = huidige().rol==='venue'
    ? 'De agenda van een andere venue is niet zichtbaar. Je ziet alleen wie er bij jou komt spelen.'
    : 'Deze venue staat niet op je tour. Zet hem in je tourschema om de vergelijking te zien.';

  const node = el(`<div class="venue-detail">
    <div class="detail-header">
      <div><div class="detail-title">${esc(v.naam)}</div>
        <div class="detail-subtitle"><span>${esc(v.zaal)} · ${esc(v.stad)}</span>
        ${eigenHuis(v)?'<span class="badge badge-warn">jouw venue</span>':''}</div></div>
      <div class="detail-actions">
        <button class="btn ${view.tab==='fiche'?'btn-primary':'btn-ghost'}" data-tab="fiche">Technische fiche</button>
        <button class="btn ${view.tab==='agenda'?'btn-primary':'btn-ghost'}" data-tab="agenda">Wie komt er spelen${k.length?' ('+k.length+')':''}</button>
      </div>
    </div>
    <div id="tabbody"></div>
  </div>`);

  const body = node.querySelector('#tabbody');
  if(view.importeren){ body.append(importPaneel()); }
  else if(view.tab==='fiche'){
    body.append(el(ficheKaart(v)));
    body.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{ view.importeren=true; render(); });
  } else if(!k.length){
    body.append(el(`<div class="empty-state" style="height:auto;padding:60px 20px"><div class="empty-state-icon">◷</div>
      <h2>Niets op komst</h2><p>${geenAgenda}</p></div>`));
  } else {
    const x = k[view.sel];
    body.append(el(`<div class="sections-grid"><div class="section-card full-width">
      <div class="section-header"><span class="section-icon">▤</span><span class="section-title">Geboekt in deze venue</span>
        <span class="section-count">${k.length}</span></div>${rijen}</div></div>`));
    body.append(matchPane({p:x.p, v, periode:`${fmtDate(x.st.van)} t/m ${fmtDate(x.st.tot)} · ${dagen(daysTo(x.st.van))}`,
      toonContact: huidige().rol==='venue'}));
    const grid = el('<div class="sections-grid"></div>');
    grid.append(overlegKaart(x.p, v, x.st));
    body.append(grid);
  }

  node.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
  node.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ view.sel=+b.dataset.a; render(); });
  return node;
}

  node.querySelector('#nieuweprod').onclick = ()=>{ view.prodId='nieuw'; render(); };

  const main = node.querySelector('#main');
  if(view.prodId==='nieuw' || !view.prodId) return main.append(nieuweProdPane());
  main.append(prodPane(DB.productions.find(p=>p.id===view.prodId)));
}

function nieuweProdPane(){
  const node = el(`<div class="venue-detail" style="max-width:520px">
    <div class="detail-header"><div><div class="detail-title">Nieuwe productie</div>
      <div class="detail-subtitle">Titel en gezelschap. De rider vul je daarna in.</div></div></div>
    <div class="form-group"><label class="form-label">Titel</label><input class="form-input" id="np" placeholder="Titel"></div>
    <div class="form-group"><label class="form-label">Gezelschap</label><input class="form-input" id="ng" placeholder="Producent"></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" id="add">Productie aanmaken</button>
      <button class="btn btn-ghost" id="annuleer">Annuleren</button></div>
    <p style="color:var(--muted);font-size:11px;margin-top:14px;font-family:var(--font-mono);line-height:1.7">Daarna vul je de rider in en zet je de speelplaatsen in het tourschema.</p>
  </div>`);
  const ann = node.querySelector('#annuleer');
  ann.onclick = ()=>{ view.prodId = mijnProducties()[0]?.id || null; render(); };
  if(!mijnProducties().length) ann.hidden = true;
  node.querySelector('#add').onclick = async()=>{
    const naam = node.querySelector('#np').value.trim(); if(!naam) return;
    const p = {id:'p'+Date.now(), owner:DB.sessie, naam, gezelschap:node.querySelector('#ng').value.trim(), contact:'', rider:{}, notities:'', tour:[]};
    DB.productions.push(p); await save(); view.prodId = p.id; render();
  };
  return node;
}

function prodPane(p){
  const stops = [...p.tour].sort((a,b)=>a.van.localeCompare(b.van));
  const stopRijen = stops.map((st,i)=>{
    const v = venueById(st.venue);
    return `<div class="issue kies" data-rij="${st.venue}">
      <span class="issue-mark" style="color:var(--muted)">${daysTo(st.tot)<0?'·':'▸'}</span>
      <div class="issue-text" style="flex:1;${daysTo(st.tot)<0?'opacity:.5':''}">
        <b class="kies-naam">${esc(v.naam)}</b> <span style="color:var(--muted)">${esc(v.stad)}</span><br>
        <span class="venue-item-date">${fmtDate(st.van)} t/m ${fmtDate(st.tot)} · ${dagen(daysTo(st.van))}</span>
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start">${ongelezen(st.id)?`<span class="badge badge-msg">✉ ${ongelezen(st.id)}</span>`:''}${statusBadge(compare(p.rider,v))}
        <button class="btn btn-ghost btn-sm" data-open="${st.venue}">Bekijk</button>
        <button class="btn btn-ghost btn-sm" data-del="${i}">✕</button></div></div>`;
  }).join('') || '<div class="sub-section" style="color:var(--muted);font-size:12px">Nog geen speelplaatsen.</div>';

  const venueOpts = VENUES.map(v=>`<option value="${v.id}">${esc(v.naam)} — ${esc(v.stad)}</option>`).join('');
  const nums = SPECS.filter(s=>s.type==='num').map(sp=>`<div class="form-group">
      <label class="form-label">${esc(sp.need)}${sp.unit?' ('+sp.unit+')':''}</label>
      <input class="form-input" type="number" step="any" data-k="${sp.k}" value="${p.rider[sp.k]??''}"></div>`).join('');
  const bools = SPECS.filter(s=>s.type==='bool').map(sp=>`<label class="form-check">
      <input type="checkbox" data-k="${sp.k}" ${p.rider[sp.k]?'checked':''}> ${esc(sp.need)}</label>`).join('');

  const node = el(`<div class="venue-detail">
    <div class="detail-header"><div><div class="detail-title">${esc(p.naam)}</div>
      <div class="detail-subtitle"><span>${esc(p.gezelschap)}</span><span class="venue-item-date">${stops.length} speelplaatsen</span></div></div></div>
    <div class="sections-grid">
      <div class="section-card full-width">
        <div class="section-header"><span class="section-icon">◷</span><span class="section-title">Tourschema</span></div>
        ${stopRijen}
        <div class="sub-section">
          <div class="form-grid">
            <div class="form-group"><label class="form-label">Theater</label><select class="form-select" id="v">${venueOpts}</select></div>
            <div class="form-group"><label class="form-label">Van</label><input class="form-input" type="date" id="van" value="${plus(30)}"></div>
            <div class="form-group"><label class="form-label">Tot en met</label><input class="form-input" type="date" id="tot" value="${plus(32)}"></div>
            <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-primary" id="addstop" style="width:100%">Toevoegen</button></div>
          </div>
          <div id="err" style="color:var(--red);font-size:11px"></div>
        </div>
      </div>
      <div class="section-card"><div class="section-header"><span class="section-icon">⟡</span><span class="section-title">Rider — maatvoering</span></div>
        <div class="sub-section"><div class="form-grid">${nums}</div></div></div>
      <div class="section-card"><div class="section-header"><span class="section-icon">✓</span><span class="section-title">Randvoorwaarden</span></div>
        <div class="sub-section">${bools}</div>
        <div class="sub-section">
          <div class="form-group"><label class="form-label">Technisch contact</label><input class="form-input" id="ct" value="${esc(p.contact)}"></div>
          <div class="form-group" style="margin-bottom:0"><label class="form-label">Toelichting voor de toneelmeester</label><input class="form-input" id="nt" value="${esc(p.notities).replace(/\n/g,' ')}"></div>
        </div></div>
    </div>
  </div>`);

  node.querySelectorAll('[data-k]').forEach(inp=>{ inp.onchange = async()=>{
    p.rider[inp.dataset.k] = inp.type==='checkbox' ? inp.checked : (inp.value===''?undefined:parseFloat(inp.value));
    await save(); };
  });
  node.querySelector('#ct').onchange = async e=>{ p.contact=e.target.value; await save(); };
  node.querySelector('#nt').onchange = async e=>{ p.notities=e.target.value; await save(); };
  node.querySelector('#addstop').onclick = async()=>{
    const van=node.querySelector('#van').value, tot=node.querySelector('#tot').value;
    if(!van||!tot||tot<van){ node.querySelector('#err').textContent='Einddatum ligt voor de begindatum.'; return; }
    const vid = node.querySelector('#v').value;
    p.tour.push({id:`${p.id}-${vid}-${van}-${Date.now()}`, venue:vid, van, tot}); await save(); render();
  };
  node.querySelectorAll('[data-del]').forEach(b=>b.onclick = async()=>{
    p.tour.splice(p.tour.indexOf(stops[+b.dataset.del]),1); await save(); render(); });
  node.querySelectorAll('[data-open]').forEach(b=>b.onclick = ()=>{
    view.mode='huizen'; view.alle=true; view.venueId=b.dataset.open; view.tab='agenda'; view.sel=null; render(); });
  return node;
}

/* ---------- het hart: rider naast de venue ---------- */
function matchPane({p, v, periode, toonContact}){
  const rows = compare(p.rider, v);
  const issues = rows.filter(r=>r.status==='bad'||r.status==='warn')
    .sort((a,b)=>(a.status==='bad'?0:1)-(b.status==='bad'?0:1))
    .map(r=>`<div class="issue ${r.status}"><span class="issue-mark">${r.status==='bad'?'!':'~'}</span><div class="issue-text">${issueText(r)}</div></div>`).join('');

  const meters = rows.filter(r=>r.sp.type==='num' && r.status!=='unknown').map(r=>{
    const max = Math.max(r.need, r.have) * 1.08;
    const haveW = r.have/max*100, needW = Math.min(r.need,r.have)/max*100;
    const overL = r.have/max*100, overW = Math.max(0, r.need-r.have)/max*100;
    return `<div class="meter ${r.status}">
      <div class="meter-head"><span class="meter-name">${esc(r.sp.label)}</span>
        <span class="meter-num">rider ${r.need}${r.sp.unit} · venue ${r.have}${r.sp.unit}</span></div>
      <div class="meter-track"><div class="meter-have" style="width:${haveW}%"></div><div class="meter-need" style="width:${needW}%"></div>
        ${overW>0?`<div class="meter-over" style="left:${overL}%;width:${overW}%"></div><div class="meter-cap" style="left:${overL}%"></div>`:''}</div></div>`;
  }).join('');

  const bad = countBad(rows);
  const onbekend = rows.filter(r=>r.status==='unknown' && p.rider[r.sp.k]!==undefined).length;
  return el(`<div class="sections-grid">
    <div class="section-card full-width">
      <div class="section-header"><span class="section-icon">${bad?'⚠':'✓'}</span>
        <span class="section-title">${esc(p.naam)} — uitdagingen</span>
        <span class="section-count">${onbekend?onbekend+' velden onbeoordeeld · ':''}${esc(periode||'')}</span></div>
      ${issues || '<div class="sub-section" style="color:var(--muted);font-size:12px">Geen knelpunten. De rider past binnen de fiche van deze venue.</div>'}
    </div>
    <div class="section-card">
      <div class="section-header"><span class="section-icon">▤</span><span class="section-title">Rider naast de venue</span></div>
      <div class="sub-section" style="color:var(--muted);font-size:11px;font-family:var(--font-mono)">Balk = wat de venue heeft. Gekleurd = wat de productie vraagt. Gestreept = eroverheen.</div>
      ${meters}
    </div>
    <div class="section-card">
      <div class="section-header"><span class="section-icon">✎</span><span class="section-title">Van de productie</span></div>
      <div class="sub-section">
        ${p.notities?`<div class="notes-area">${esc(p.notities)}</div>`:'<div style="color:var(--muted);font-size:12px">Geen toelichting meegestuurd.</div>'}
        ${toonContact&&p.contact?`<div class="data-row" style="margin-top:12px"><div class="data-label">Technisch contact</div><div class="data-value mono">${esc(p.contact)}</div></div>`:''}
        <div class="data-row"><div class="data-label">Gezelschap</div><div class="data-value mono">${esc(p.gezelschap)}</div></div>
      </div>
    </div>
  </div>`);
}

/* ---------- melding voor de toneelmeester ---------- */
function melding(){
  const u = huidige();
  const v = u && u.rol==='venue' ? venueById(u.venueId) : null;
  if(!v) return;                                   // geen venue aan dit account gekoppeld
  const sleutel = k => v.id+'|'+k.p.id+'|'+k.st.van;
  const nieuw = komend(v.id).filter(k=>daysTo(k.st.van)<=21 && !DB.gezien[sleutel(k)]);
  if(!nieuw.length) return;
  const items = nieuw.map(k=>{
    const rows = compare(k.p.rider,v);
    return `<div class="alert-item">
      <div><div class="alert-item-name">${esc(k.p.naam)}</div>
        <div class="alert-item-when">${fmtDate(k.st.van)} t/m ${fmtDate(k.st.tot)} · ${dagen(daysTo(k.st.van))}</div></div>
      <div>${statusBadge(rows)}</div></div>`;
  }).join('');
  overlay.innerHTML = `<div class="modal alert" role="dialog" aria-modal="true">
    <div class="modal-header"><div><div class="alert-eyebrow">Nieuw in je agenda</div>
      <div class="modal-title">${nieuw.length} productie${nieuw.length>1?'s':''} op komst</div></div>
      <button class="modal-close" id="x">✕</button></div>
    <div class="modal-body">${items}</div>
    <div class="modal-footer"><button class="btn btn-ghost" id="later">Later</button><button class="btn btn-primary" id="ok">Bekijk de riders</button></div>
  </div>`;
  overlay.classList.add('open');
  const close = async(mark)=>{
    if(mark){ nieuw.forEach(k=>DB.gezien[sleutel(k)]=1); await save(); }
    overlay.classList.remove('open'); overlay.innerHTML='';
  };
  overlay.querySelector('#ok').onclick = ()=>close(true);
  overlay.querySelector('#x').onclick = ()=>close(false);
  overlay.querySelector('#later').onclick = ()=>close(false);
  overlay.onclick = e=>{ if(e.target===overlay) close(false); };
  document.addEventListener('keydown', function esc(e){
    if(e.key==='Escape'){ close(false); document.removeEventListener('keydown', esc); }
  });
  overlay.querySelector('#ok').focus();
}

document.getElementById('switch').onclick = uitloggen;

/* de balk kan afbreken op een telefoon; de kolommen moeten die hoogte volgen */
function meetKop(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--kop', h + 'px');
}
window.addEventListener('resize', meetKop);
window.addEventListener('orientationchange', ()=>setTimeout(meetKop, 250));

/* Op een telefoon tonen we óf de lijst óf het detail, met een terugknop ertussen.
   Het werkveld begint bij de berichten, de rest bij de lijst. */
const smalScherm = () => window.innerWidth <= 640;
const lijstLabel = () => {
  const u = huidige();
  if(view.mode==='werkveld') return 'Collega\'s';
  if(view.mode==='markt') return 'Categorieën';
  if(view.mode==='mijn') return 'Mijn producties';
  return u && u.rol==='venue' ? 'Boekingen' : 'Theaters';
};
function mobielStand(){
  if(view.mobiel) return view.mobiel;
  // waar de inhoud staat verschilt per scherm: bij het werkveld en de markt
  // zit die rechts (berichten, advertenties), elders links (de lijst zelf)
  return (view.mode==='werkveld' || view.mode==='markt') ? 'detail' : 'lijst';
}
function naarDetail(){
  if(!smalScherm()) return;
  view.mobiel = 'detail';
  pasMobielAan();
  window.scrollTo(0,0);
}
function pasMobielAan(){
  const shell = document.querySelector('.shell');
  if(!shell) return;
  shell.classList.remove('toon-lijst','toon-detail');
  shell.querySelector('.terugbalk')?.remove();
  if(!smalScherm()) return;
  const stand = mobielStand();
  shell.classList.add(stand==='detail' ? 'toon-detail' : 'toon-lijst');
  if(stand==='detail'){
    const main = shell.querySelector('.main');
    const balk = el(`<div class="terugbalk"><button>← ${esc(lijstLabel())}</button></div>`);
    balk.querySelector('button').onclick = ()=>{ view.mobiel='lijst'; pasMobielAan(); window.scrollTo(0,0); };
    main.prepend(balk);
  }
}
window.addEventListener('resize', ()=>{ navBalk(huidige()); pasMobielAan(); meetKop(); });

let opslagGemeld = false;
function meldOpslagProbleem(){
  if(opslagGemeld) return;
  opslagGemeld = true;
  const m = el(`<div class="opslagmelding">
    <div style="flex:1">Dit apparaat bewaart geen gegevens voor deze demo. Je kunt alles bekijken en uitproberen,
      maar wat je invult is na het herladen weg.</div>
    <button aria-label="Sluiten">✕</button></div>`);
  document.body.append(m);
  m.querySelector('button').onclick = ()=>m.remove();
}

function boot(){
  try { render(); meetKop(); const u = huidige(); if(u && u.rol==='venue') melding(); }
  catch(e){
    console.error(e);
    document.querySelector('.welcome-overlay')?.remove();
    app.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠</div>
      <h2>Er ging iets mis bij het laden</h2>
      <p>De opgeslagen gegevens passen niet bij deze versie: ${esc(e.message)}</p>
      <button class="btn btn-primary" id="rs">Demodata herstellen</button></div>`;
    document.getElementById('rs').onclick = reset;
  }
}
load().then(boot);
</script>
